<script>
// ── Pages board: live index parsed from /sitemap.xml ──
(() => {
  let all = [], query = '';
  const depthOf = (path) => path.split('/').filter(Boolean).length;

  const filtered = () => {
    let list = all;
    if (query) list = list.filter((p) => p.path.toLowerCase().includes(query.toLowerCase()));
    return [...list].sort((a, b) => depthOf(a.path) - depthOf(b.path) || a.path.localeCompare(b.path));
  };

  const render = () => {
    const list = filtered();
    document.getElementById('pg-tbody').innerHTML = list.length ? list.map((p) => {
      const d = depthOf(p.path);
      return `<tr><td style="padding-left:16px"><div class="pg-url">
        <div class="pg-urlic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9s-1.4 6.4-3.9 9c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg></div>
        <div style="min-width:0"><b>${esc(p.path === '/' ? 'Home' : p.path.replace(/^\//, '').replace(/-/g, ' '))}</b><span>${esc(p.loc)}</span></div></div></td>
      <td style="font-size:11px">${esc(p.loc)}</td>
      <td><span class="pg-depth">${d === 0 ? 'home' : 'level ' + d}</span></td>
      <td style="text-align:right;padding-right:16px"><a class="pj-btn" style="font-size:11px;padding:6px 12px;text-decoration:none" href="${esc(p.loc)}" target="_blank" rel="noopener">Visit ↗</a></td></tr>`;
    }).join('') : `<tr><td colspan="4" style="text-align:center;color:#5E5E6E;padding:28px">No pages match.</td></tr>`;
    document.getElementById('kpi-total').textContent = all.length;
    document.getElementById('kpi-top').textContent = all.filter((p) => depthOf(p.path) <= 1).length;
    document.getElementById('kpi-nested').textContent = all.filter((p) => depthOf(p.path) > 1).length;
    document.getElementById('kpi-sections').textContent = new Set(all.map((p) => p.path.split('/').filter(Boolean)[0] || '/')).size;
    document.getElementById('pg-count').textContent = `Showing ${list.length} of ${all.length} pages from /sitemap.xml.`;
  };

  document.getElementById('pg-search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
  document.getElementById('pg-export').addEventListener('click', () => {
    const rows = [['Page', 'URL', 'Depth']];
    filtered().forEach((p) => rows.push([p.path, p.loc, depthOf(p.path)]));
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'pages.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  const load = async () => {
    try {
      const res = await fetch('/sitemap.xml');
      const xml = await res.text();
      const locs = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1].trim());
      const base = location.origin;
      all = locs.map((loc) => ({ loc, path: loc.startsWith(base) ? loc.slice(base.length) || '/' : new URL(loc).pathname }));
      render();
    } catch (e) { toast('Could not load the sitemap.', false); }
  };
  document.getElementById('pg-refresh').addEventListener('click', load);
  load();
})();
</script>
