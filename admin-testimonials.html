.tm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tm-kpi{background:#12121A;border:1px solid #1F1F2B;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.tm-kpi-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.tm-kpi-val{font-size:24px;font-weight:800;color:#fff;font-family:'Manrope';line-height:1.1}
.tm-kpi-label{font-size:11px;color:#B9B9C4;margin-top:2px}
.tm-kpi-sub{font-size:10.5px;color:#7A7A88;margin-top:5px}
.tm-body{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.tm-tabs{display:flex;align-items:center;gap:2px;margin-bottom:12px}
.tm-toolbar{margin-left:auto;display:flex;align-items:center;gap:8px}
.tm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tm-card{background:#12121A;border:1px solid #1F1F2B;border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.tm-stars{color:#FBBF24;font-size:13px;letter-spacing:2px}
.tm-quote{font-size:13px;color:#EDEDF2;line-height:1.6;margin:0;flex:1}
.tm-who{display:flex;align-items:center;gap:10px}
.tm-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}
.tm-who b{display:block;font-size:12px;color:#fff}
.tm-who span{font-size:10.5px;color:#7A7A88}
.tm-foot{display:flex;align-items:center;gap:8px;border-top:1px solid #1B1B26;padding-top:12px}
.tm-approved{font-size:10px;font-weight:700;color:#4ADE80;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);padding:3px 9px;border-radius:6px}
.tm-act{margin-left:auto;display:flex;gap:6px}
.tm-bars{display:grid;gap:8px}
.tm-barow{display:grid;grid-template-columns:34px 1fr 30px;gap:10px;align-items:center;font-size:11px;color:#B9B9C4}
.tm-barow .track{height:5px;border-radius:3px;background:#262633;overflow:hidden}
.tm-barow .track i{display:block;height:100%;background:#FBBF24;border-radius:3px}
.tm-barow b{color:#fff;text-align:right}
@media(max-width:1280px){.tm-kpis{grid-template-columns:repeat(2,1fr)}.tm-body{grid-template-columns:1fr}.tm-grid{grid-template-columns:1fr}}
</style>

<script>
// ── Testimonials board: live rows from /api/feedback ──
(() => {
  const approved = () => { try { return JSON.parse(localStorage.getItem('tm_approved') || '[]'); } catch { return []; } };
  const setApproved = (ids) => localStorage.setItem('tm_approved', JSON.stringify(ids));
  // feedback.source doubles as "Name · Role" for testimonials created here.
  const who = (f) => {
    const parts = String(f.source || '').split('·').map((s) => s.trim());
    return parts.length > 1 ? { name: parts[0], role: parts.slice(1).join(' · ') } : { name: '', role: parts[0] || '' };
  };
  const stars = (r) => '★★★★★'.slice(0, Math.max(0, Math.min(5, Math.round(Number(r) || 0)))).padEnd(5, '☆');
  let all = [], tab = 'all', query = '', sort = 'latest';

  const filtered = () => {
    const appr = approved();
    let list = all.filter((f) => {
      if (tab === 'five') return Number(f.rating) === 5;
      if (tab === 'four') return Number(f.rating) >= 4;
      if (tab === 'approved') return appr.includes(f.id);
      return true;
    }).filter((f) => {
      if (!query) return true;
      return ((f.message || '') + ' ' + (f.source || '')).toLowerCase().includes(query.toLowerCase());
    });
    if (sort === 'oldest') list = [...list].sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
    else if (sort === 'highest') list = [...list].sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
    else if (sort === 'lowest') list = [...list].sort((a, b) => (Number(a.rating) || 0) - (Number(b.rating) || 0));
    else list = [...list].sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
    return list;
  };

  const card = (f) => {
    const { name, role } = who(f);
    const col = avatarColor(name || role);
    const isAppr = approved().includes(f.id);
    return `<div class="tm-card">
      <div class="tm-stars">${stars(f.rating)}</div>
      <p class="tm-quote">“${esc(f.message || '')}”</p>
      <div class="tm-who"><div class="tm-av" style="background:${col}22;color:${col}">${esc(initials(name || role))}</div>
        <div><b>${esc(name || 'Anonymous')}</b><span>${esc(role)}</span></div></div>
      <div class="tm-foot">${isAppr ? '<span class="tm-approved">✓ Approved</span>' : ''}
        <div class="tm-act">
          <button class="pj-icbtn" data-act="toggle" data-id="${f.id}" title="${isAppr ? 'Unapprove' : 'Approve'}">${isAppr ? '★' : '☆'}</button>
          <button class="pj-icbtn" data-act="edit" data-id="${f.id}" title="Edit">✎</button>
          <button class="pj-icbtn" data-act="del" data-id="${f.id}" title="Delete">🗑</button>
        </div></div>
    </div>`;
  };

  const render = () => {
    const list = filtered();
    document.getElementById('tm-grid').innerHTML = list.length ? list.map(card).join('')
      : `<div style="grid-column:1/-1;text-align:center;color:#5E5E6E;padding:28px">No testimonials match.</div>`;
    const n = all.length;
    const avg = n ? all.reduce((s, f) => s + (Number(f.rating) || 0), 0) / n : 0;
    document.getElementById('kpi-total').textContent = n;
    document.getElementById('kpi-avg').textContent = n ? avg.toFixed(1) : '—';
    document.getElementById('kpi-five').textContent = all.filter((f) => Number(f.rating) === 5).length;
    document.getElementById('kpi-appr').textContent = approved().filter((id) => all.some((f) => f.id === id)).length;
    document.getElementById('tm-bars').innerHTML = [5, 4, 3, 2, 1].map((r) => {
      const c = all.filter((f) => Math.round(Number(f.rating) || 0) === r).length;
      return `<div class="tm-barow"><span>★ ${r}</span><div class="track"><i style="width:${n ? Math.round((c / n) * 100) : 0}%"></i></div><b>${c}</b></div>`;
    }).join('');
  };

  const setTab = (t) => {
    tab = t;
    document.querySelectorAll('#tm-tabs .pj-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
    render();
  };
  const FIELDS = [
    { name: 'name', label: 'Client name', required: true },
    { name: 'role', label: 'Role / Company' },
    { name: 'rating', label: 'Rating (1–5)', type: 'select', options: ['5', '4', '3', '2', '1'], value: '5' },
    { name: 'message', label: 'Testimonial', type: 'textarea', required: true },
  ];
  document.getElementById('tm-new').addEventListener('click', () => modal({
    title: 'New Testimonial',
    fields: FIELDS,
    onSubmit: async (d) => {
      const r = Math.max(1, Math.min(5, Number(d.rating) || 5));
      await api('/api/feedback', { method: 'POST', body: { source: d.role ? `${d.name} · ${d.role}` : d.name, rating: r, message: d.message } });
      load();
    },
  }));
  document.getElementById('tm-grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const f = all.find((x) => x.id === Number(btn.dataset.id));
    if (!f) return;
    if (btn.dataset.act === 'toggle') {
      const ids = approved();
      setApproved(ids.includes(f.id) ? ids.filter((x) => x !== f.id) : [...ids, f.id]);
      render();
      return;
    }
    if (btn.dataset.act === 'del') {
      if (!confirm('Delete this testimonial?')) return;
      try { await api('/api/feedback/' + f.id, { method: 'DELETE' }); load(); }
      catch (err) { toast(err.message, false); }
      return;
    }
    const { name, role } = who(f);
    modal({
      title: 'Edit Testimonial',
      fields: FIELDS.map((x) => ({ ...x, value: x.name === 'name' ? name : x.name === 'role' ? role : x.name === 'rating' ? String(f.rating ?? 5) : x.name === 'message' ? f.message : x.value ?? '' })),
      onSubmit: async (d) => {
        const r = Math.max(1, Math.min(5, Number(d.rating) || 5));
        await api('/api/feedback/' + f.id, { method: 'PUT', body: { source: d.role ? `${d.name} · ${d.role}` : d.name, rating: r, message: d.message } });
        load();
      },
      onDelete: async () => { await api('/api/feedback/' + f.id, { method: 'DELETE' }); load(); },
    });
  });
  document.querySelectorAll('#tm-tabs .pj-tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  document.getElementById('tm-search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
  document.getElementById('tm-sort').addEventListener('change', (e) => { sort = e.target.value; render(); });
  document.getElementById('tm-export').addEventListener('click', () => {
    const rows = [['Name', 'Role', 'Rating', 'Message', 'Created']];
    filtered().forEach((f) => { const { name, role } = who(f); rows.push([name, role, f.rating, f.message, f.created_at]); });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'testimonials.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const load = async () => {
    try { all = (await api('/api/feedback')).data; render(); }
    catch (e) { toast(e.message, false); }
  };
  load();
})();
</script>
