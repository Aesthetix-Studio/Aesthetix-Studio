  </aside>

  <div class="dash-main">
    <div class="dash-topbar">
      <div>
        <h1>Activity Logs</h1>
        <p>Every change across the studio, timestamped in one feed.</p>
      </div>
      <div class="dash-topbar-right">
        <div class="dash-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="al-search" placeholder="Search activity...">
        </div>
        <button class="pj-btn" id="al-export"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
        <button class="btn-new" id="al-refresh">↻ Refresh</button>
      </div>
    </div>

    <div class="dash-content" style="overflow-y:auto;height:calc(100vh - 80px)">
      <div class="al-tabs" id="al-tabs">
        <button class="pj-tab active" data-tab="all">All Activity</button>
        <button class="pj-tab" data-tab="projects">Projects</button>
        <button class="pj-tab" data-tab="articles">Articles</button>
        <button class="pj-tab" data-tab="leads">Leads</button>
        <button class="pj-tab" data-tab="media">Media</button>
        <button class="pj-tab" data-tab="messages">Messages</button>
        <button class="pj-tab" data-tab="feedback">Feedback</button>
      </div>

        <div class="al-feed" id="al-feed"></div>

      <p style="font-size:11px;color:#5E5E6E;margin:12px 4px 20px" id="al-count"></p>
    </div>
  </div>
</div>

<script>
// ── Activity Logs: live cross-entity feed (newest first) ──
(() => {
  const ENT = {
    projects: { label: 'Project', color: '#8B5CF6', icon: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M8 2v4M16 2v4M2 10h20"/>', title: (r) => r.title, meta: (r) => r.client || '' },
    articles: { label: 'Article', color: '#60A5FA', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>', title: (r) => r.title, meta: (r) => r.author || '' },
    leads: { label: 'Lead', color: '#EC4899', icon: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>', title: (r) => r.name, meta: (r) => [r.company, r.email].filter(Boolean).join(' · ') },
    media: { label: 'Media', color: '#4ADE80', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>', title: (r) => r.name, meta: (r) => [r.type, r.size].filter(Boolean).join(' · ') },
    messages: { label: 'Message', color: '#2DD4BF', icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', title: (r) => String(r.content || '').slice(0, 80), meta: (r) => [r.role, r.thread].filter(Boolean).join(' · ') },
    feedback: { label: 'Feedback', color: '#FBBF24', icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', title: (r) => String(r.message || '').slice(0, 80), meta: (r) => [r.source, r.rating ? r.rating + '★' : ''].filter(Boolean).join(' · ') },
  };
  let all = [], tab = 'all', query = '';

  const filtered = () => all
    .filter((e) => (tab === 'all' ? true : e.entity === tab))
    .filter((e) => {
      if (!query) return true;
      return (e.title + ' ' + e.meta).toLowerCase().includes(query.toLowerCase());
    });

  const render = () => {
    const list = filtered().slice(0, 80);
    document.getElementById('al-feed').innerHTML = list.length ? list.map((e) => {
      const c = ENT[e.entity];
      return `<div class="al-item">
        <div class="al-ic" style="background:${c.color}22;color:${c.color}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div>
        <div style="min-width:0"><b>${esc(e.title || '(untitled)')}</b><span>${esc(e.meta)}</span></div>
        <span class="al-entity" style="color:${c.color};background:${c.color}1A">${c.label}</span>
        <time>${esc(dashAgo(e.ts))}<br>${esc(fmtDate(e.ts))}</time></div>`;
    }).join('') : `<div style="text-align:center;color:#5E5E6E;padding:28px">No activity matches.</div>`;
    document.getElementById('al-count').textContent = `Showing ${list.length} of ${filtered().length} events (latest 80).`;
  };

  const setTab = (t) => {
    tab = t;
    document.querySelectorAll('#al-tabs .pj-tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
    render();
  };

  const load = async () => {
    document.getElementById('al-feed').innerHTML = `<div style="text-align:center;color:#5E5E6E;padding:28px">Loading activity…</div>`;
    const out = [];
    await Promise.all(Object.keys(ENT).map(async (entity) => {
      try {
        const { data } = await api('/api/' + entity);
        (data || []).filter((r) => !r._demo).forEach((r) => out.push({
          entity, title: ENT[entity].title(r), meta: ENT[entity].meta(r), ts: r.created_at || '',
        }));
      } catch { /* entity offline — skip */ }
    }));
    out.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
    all = out;
    render();
  };
  document.querySelectorAll('#al-tabs .pj-tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  document.getElementById('al-search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
  document.getElementById('al-export').addEventListener('click', () => {
    const rows = [['Type', 'Title', 'Meta', 'Timestamp']];
    filtered().forEach((e) => rows.push([ENT[e.entity].label, e.title, e.meta, e.ts]));
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'activity.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById('al-refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
