.tg-list{display:grid;gap:10px}

.tg-act{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.tg-sug{display:flex;flex-wrap:wrap;gap:8px}

.tg-sug button:hover{border-color:#7C3AED;color:#fff}
@media(max-width:1280px){.tg-kpis{grid-template-columns:repeat(2,1fr)}.tg-body{grid-template-columns:1fr}}

  <div class="dash-main">

        <h1>Tags</h1>

      </div>
      <div class="dash-topbar-right">
        <div class="dash-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

<script>
// ── Tags board: localStorage tags + live article-match counts ──
(() => {
  const COLORS = ['#7C5CFF', '#3B82F6', '#22C55E', '#FBBF24', '#EC4899', '#2DD4BF', '#A78BFA', '#FB923C'];
  const loadTags = () => { try { return JSON.parse(localStorage.getItem('ar_tags_full') || '[]'); } catch { return []; } };
  const saveTags = (t) => localStorage.setItem('ar_tags_full', JSON.stringify(t));
  const colorFor = (name) => COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
  let articles = [], query = '';

  const matchCount = (tag) => {
    const q = tag.toLowerCase();
    return articles.filter((a) => ((a.title || '') + ' ' + (a.category || '')).toLowerCase().includes(q)).length;
  };
  const rows = () => {
    let list = loadTags().map((t) => typeof t === 'string'
      ? { name: t, color: colorFor(t) }
      : { name: t.name, color: t.color || colorFor(t.name) });
    if (query) list = list.filter((t) => t.name.toLowerCase().includes(query.toLowerCase()));
    return list.map((t) => ({ ...t, n: matchCount(t.name) })).sort((a, b) => b.n - a.n);
  };

  const render = () => {
    const list = rows();
    const max = list.length ? Math.max(1, ...list.map((t) => t.n)) : 1;
    document.getElementById('tg-list').innerHTML = list.length ? list.map((t) => `<div class="tg-row">
      <span class="tg-pill" style="color:${t.color};background:${t.color}1F"># ${esc(t.name)}</span>
      <span class="c"><b>${t.n}</b> article${t.n === 1 ? '' : 's'}</span>
      <div class="tg-bar"><i style="width:${Math.max(3, Math.round((t.n / max) * 100))}%;background:${t.color}"></i></div>
      <div class="tg-act">
        <button class="pj-icbtn" data-act="rename" data-name="${esc(t.name)}" title="Rename">✎</button>
        <button class="pj-icbtn" data-act="del" data-name="${esc(t.name)}" title="Delete">🗑</button>
      </div></div>`).join('')
      : `<div class="tg-row" style="justify-content:center;color:#5E5E6E">No tags yet — create one or add a suggestion.</div>`;
    const tagged = new Set();
    articles.forEach((a) => {
      const hay = ((a.title || '') + ' ' + (a.category || '')).toLowerCase();
      if (loadTags().some((t) => hay.includes((typeof t === 'string' ? t : t.name).toLowerCase()))) tagged.add(a.id);
    });
    document.getElementById('kpi-tags').textContent = loadTags().length;
    document.getElementById('kpi-tagged').textContent = tagged.size;
    document.getElementById('kpi-top').textContent = list.length ? list[0].n : '—';
    document.getElementById('kpi-top-sub').textContent = list.length ? '#' + list[0].name : 'most matched tag';
    document.getElementById('kpi-untagged').textContent = articles.length - tagged.size;
    const have = new Set(loadTags().map((t) => (typeof t === 'string' ? t : t.name).toLowerCase()));
    const sug = [...new Set(articles.map((a) => (a.category || '').trim()).filter((c) => c && !have.has(c.toLowerCase())))].slice(0, 8);
    document.getElementById('tg-sug').innerHTML = sug.length ? sug.map((c) =>
      `<button data-add="${esc(c)}">＋ ${esc(c)}</button>`).join('')
      : `<span style="font-size:11px;color:#5E5E6E">Every category is already a tag.</span>`;
  };

  const upsert = (name, color) => {
    const tags = loadTags().map((t) => (typeof t === 'string' ? { name: t, color: colorFor(t) } : t));
    const i = tags.findIndex((t) => t.name.toLowerCase() === name.toLowerCase());
    if (i >= 0) tags[i] = { name, color: color || tags[i].color };
    else tags.push({ name, color: color || colorFor(name) });
    saveTags(tags);
    render();
  };
  document.getElementById('tg-new').addEventListener('click', () => modal({
    title: 'New Tag',
    fields: [{ name: 'name', label: 'Tag name (without #)', required: true }],
    onSubmit: async (d) => { upsert(d.name.trim().replace(/^#+/, '')); },
  }));
  document.getElementById('tg-list').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const name = btn.dataset.name;
    if (btn.dataset.act === 'del') {
      if (!confirm(`Delete tag "#${name}"?`)) return;
      saveTags(loadTags().filter((t) => (typeof t === 'string' ? t : t.name) !== name));
      render();
    } else {
      modal({
        title: 'Rename Tag',
        fields: [{ name: 'name', label: 'Tag name', value: name, required: true }],
        onSubmit: async (d) => {
          const nn = d.name.trim().replace(/^#+/, '');
          if (nn && nn !== name) {
            saveTags(loadTags().map((t) => {
              const cur = typeof t === 'string' ? t : t.name;
              return cur === name ? { name: nn, color: colorFor(nn) } : t;
            }));
            render();
          }
        },
      });
    }
  });
  document.getElementById('tg-sug').addEventListener('click', (e) => {
    const b = e.target.closest('[data-add]');
    if (b) upsert(b.dataset.add);
  });
  document.getElementById('tg-search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
  document.getElementById('tg-export').addEventListener('click', () => {
    const rows = [['Tag', 'Articles']];
    rows().forEach((t) => rows.push(['#' + t.name, t.n]));
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'tags.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  const load = async () => {
    try { articles = (await api('/api/articles')).data; } catch (e) { toast(e.message, false); articles = []; }
    render();
  };
  load();
})();
</script>
